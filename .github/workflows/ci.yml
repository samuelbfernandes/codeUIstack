name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # the workflow can read the repository and nothing else

jobs:
  python:
    name: installer tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  guards:
    name: git guard tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: bash global/tests/test-hooks.sh

  audit:
    name: capability audit and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/audit.py --check
      - run: python scripts/build_marketplace.py --check

  mods:
    name: validate and test the mods
    runs-on: ubuntu-latest
    # Not yet confirmed on a hosted runner: if `claude plugin test` needs more than the CLI, fix it here, then remove the next line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: for m in mods/*/; do claude plugin validate "$m" && claude plugin test "$m"; done

  wheel:
    name: build the wheel and install it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: bash scripts/test-wheel.sh
